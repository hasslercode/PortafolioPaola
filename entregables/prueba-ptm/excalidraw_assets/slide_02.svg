 d="M 85 303 L 89 308 L 96 299" fill="none" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><text x="108" y="310.0" fill="#1F2937" font-size="24" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Mensajes técnicos / poco concretos</text><circle cx="90" cy="354" r="11" fill="#DCFCE7" stroke="#0B6E6E" stroke-width="2"/><path d="M 85 353 L 89 358 L 96 349" fill="none" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><text x="108" y="360.0" fill="#1F2937" font-size="24" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Canales sueltos, sin viaje único</text><path d="M 539.9220243297633 280.13541014084046 Q 583.3626435135354 281.7901836309762 619.9732171097231 279.44362202198204" fill="none" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><line x1="620" y1="280" x2="608.0035574528347" y2="287.2170192055005" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><line x1="620" y1="280" x2="608.0035574528347" y2="272.7829807944995" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><rect x="639.1233362188445" y="100.99785819035122" width="460" height="360" rx="18" fill="#DCFCE7" fill-opacity="0.9" stroke="#1F2937" stroke-width="2.5" stroke-linejoin="round"/><text x="670" y="150.0" fill="#0B6E6E" font-size="32" font-family="Caveat, Comic Sans MS, cursive" font-weight="700" text-anchor="start">Oportunidad</text><circle cx="670" cy="204" r="11" fill="#DCFCE7" stroke="#0B6E6E" stroke-width="2"/><path d="M 665 203 L 669 208 L 676 199" fill="none" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><text x="688" y="210.0" fill="#1F2937" font-size="24" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Partir del mostrador real</text><circle cx="670" cy="254" r="11" fill="#DCFCE7" stroke="#0B6E6E" stroke-width="2"/><path d="M 665 253 L 669 258 L 676 249" fill="none" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><t