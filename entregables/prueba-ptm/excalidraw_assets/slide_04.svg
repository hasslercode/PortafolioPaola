xt-anchor="start">«El mostrador que hace más»</text><text x="90" y="395.0" fill="#1F2937" font-size="26" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Línea: Active más oportunidades · empiece por una.</text><rect x="802.0676590950292" y="240.67509552958106" width="740" height="200" rx="18" fill="#DBEAFE" fill-opacity="1" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="830" y="290.0" fill="#0B6E6E" font-size="30" font-family="Caveat, Comic Sans MS, cursive" font-weight="700" text-anchor="start">Reason to believe</text><circle cx="830" cy="334" r="11" fill="#DCFCE7" stroke="#0B6E6E" stroke-width="2"/><path d="M 825 333 L 829 338 L 836 329" fill="none" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><text x="848" y="340.0" fill="#1F2937" font-size="22" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Ya es comercio PTM</text><circle cx="830" cy="362" r="11" fill="#DCFCE7" stroke="#0B6E6E" stroke-width="2"/><path d="M 825 361 L 829 366 L 836 357" fill="none" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><text x="848" y="368.0" fill="#1F2937" font-size="22" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Servicios del día a día</text><circle cx="830" cy="390" r="11" fill="#DCFCE7" stroke="#0B6E6E" stroke-width="2"/><path d="M 825 389 L 829 394 L 836 385" fill="none" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><text x="848" y="396.0" fill="#1F2937" font-size="22" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Equipo que acompaña</text><circle cx="830" cy="418" r="11" fill="#DCFCE7" stroke="#0B6E6E" stroke-width="2"/><path d="M 825 417 L 829 422 L 836 413" fill="none" stroke="#0B6E6E" stroke-width="2.5" stroke-linecap="round"/><text x="848" y="424.0" fill="#1F2937" font-size="22" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Prueba fácil de medir</text><rect x="59.70575978146139" y="478.41851824357474" width="460" height="320" rx="18" fill="#FEE2E2" fill-opacity="1" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="90" y="550.0" fill="#0B6E6E" font-size="32" font-family="Caveat, Comic Sans MS, cursive" font-weight="700" text-anchor="start">1. Claridad útil</text><text x="90" y="630.0" fill="#1F2937" font-size="28" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Qué puede activar y cómo se</text><text x="90" y="662.2" fill="#1F2937" font-size="28" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">ve en plata</text><rect x="559.6796216721439" y="480.4438433915626" width="460" height="320" rx="18" fill="#DCFCE7" fill-opacity="1" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="590" y="550.0" fill="#0B6E6E" font-size="32" font-family="Caveat, Comic Sans MS, cursive" font-weight="700" text-anchor="start">2. Prueba fácil</text><text x="590" y="630.0" fill="#1F2937" font-size="28" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Una acción concreta esta</text><text x="590" y="662.2" fill="#1F2937" font-size="28" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">semana</text><rect x="1060.6721609293866" y="478.49356099606734" width="460" height="320" rx="18" fill="#EDE9FE" fill-opacity="1" stroke="#1F2937" stroke-width="2.2" stroke-linejoin="round"/><text x="1090" y="550.0" fill="#0B6E6E" font-size="32" font-family="Caveat, Comic Sans MS, cursive" font-weight="700" text-anchor="start">3. Acompañamiento</text><text x="1090" y="630.0" fill="#1F2937" font-size="28" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">Comercial + WhatsApp para</text><text x="1090" y="662.2" fill="#1F2937" font-size="28" font-family="Caveat, Comic Sans MS, cursive" font-weight="400" text-anchor="start">no dejar solo</text