    <script>
        (function () {
            var header = document.querySelector('.site-header-refined');
            var menuToggle = document.querySelector('.menu-toggle-refined');
            var menuPanel = document.getElementById('header-menu-panel');

            if (!header || !menuToggle || !menuPanel) {
                return;
            }

            function isMobileViewport() {
                return globalThis.matchMedia('(max-width: 992px)').matches;
            }

            function getMenuLabel(type) {
                var labels = window.__HEADER_MENU_LABELS__;
                if (labels && labels[type]) {
                    return labels[type];
                }
                return type === 'close' ? 'Cerrar menu' : 'Abrir menu';
            }

            function closeMenu() {
                header.classList.remove('menu-open');
                menuToggle.setAttribute('aria-expanded', 'false');
                menuToggle.setAttribute('aria-label', getMenuLabel('open'));
            }

            function openMenu() {
                header.classList.add('menu-open');
                menuToggle.setAttribute('aria-expanded', 'true');
                menuToggle.setAttribute('aria-label', getMenuLabel('close'));
            }

            function syncMenuByViewport() {
                if (!isMobileViewport()) {
                    closeMenu();
                }
            }

            menuToggle.addEventListener('click', function () {
                if (header.classList.contains('menu-open')) {
                    closeMenu();
                } else {
                    openMenu();
                }
            });

            document.addEventListener('click', function (event) {
                if (!isMobileViewport() || !header.classList.contains('menu-open')) {
                    return;
                }
                if (!header.contains(event.target)) {
                    closeMenu();
                }
            });

            menuPanel.querySelectorAll('a[href^="#"]').forEach(function (link) {
                link.addEventListener('click', function () {
                    if (isMobileViewport()) {
                        closeMenu();
                    }
                });
            });

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') {
                    closeMenu();
                }
            });

            globalThis.addEventListener('scroll', function () {
                if (isMobileViewport() && header.classList.contains('menu-open')) {
                    closeMenu();
                }
            }, { passive: true });

            globalThis.addEventListener('resize', syncMenuByViewport);
            syncMenuByViewport();
        })();

        (function () {
            var animatedElements = document.querySelectorAll('.fade-up');
            if (!('IntersectionObserver' in globalThis)) {
                animatedElements.forEach(function (element) {
                    element.classList.add('is-visible');
                });
                return;
            }
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.15,
                rootMargin: '0px 0px -5% 0px'
            });
            animatedElements.forEach(function (element, index) {
                element.style.transitionDelay = (index % 5) * 60 + 'ms';
                observer.observe(element);
            });
        })();

        (function () {
            var contactOpeners = document.querySelectorAll('[data-open-contact-modal]');
            var contactModal = document.getElementById('contact-modal');

            if (!contactModal || !contactOpeners.length) {
                return;
            }

            var contactClosers = contactModal.querySelectorAll('[data-close-contact-modal]');

            function openContactModal() {
                if (typeof contactModal.showModal === 'function' && !contactModal.open) {
                    contactModal.showModal();
                } else {
                    contactModal.setAttribute('open', 'open');
                }
                contactModal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('modal-open');
            }

            function closeContactModal() {
                if (typeof contactModal.close === 'function' && contactModal.open) {
                    contactModal.close();
                } else {
                    contactModal.removeAttribute('open');
                }
                contactModal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
            }

            contactOpeners.forEach(function (trigger) {
                trigger.addEventListener('click', function (event) {
                    event.preventDefault();
                    openContactModal();
                });
            });

            contactClosers.forEach(function (closer) {
                closer.addEventListener('click', closeContactModal);
            });

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && contactModal.open) {
                    closeContactModal();
                }
            });
        })();

        (function () {
            var openers = document.querySelectorAll('[data-open-portfolio-modal]');
            var modal = document.getElementById('portfolio-modal');

            if (!modal || !openers.length) {
                return;
            }

            var closers = modal.querySelectorAll('[data-close-portfolio-modal]');

            function openModal() {
                if (typeof modal.showModal === 'function' && !modal.open) {
                    modal.showModal();
                } else {
                    modal.setAttribute('open', 'open');
                }
                modal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('modal-open');
            }

            function closeModal() {
                if (typeof modal.close === 'function' && modal.open) {
                    modal.close();
                } else {
                    modal.removeAttribute('open');
                }
                modal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
            }

            openers.forEach(function (trigger) {
                trigger.addEventListener('click', function (event) {
                    event.preventDefault();
                    openModal();
                });
            });

            closers.forEach(function (closer) {
                closer.addEventListener('click', closeModal);
            });

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && modal.open) {
                    closeModal();
                }
            });
        })();
    </script>
